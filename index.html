<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FantaBuzzer — Receiver</title>
<style>
  html,body{margin:0;height:100%;background:#0b1220;color:#f5f7fa;font-family:'Segoe UI',Roboto,sans-serif;overflow:hidden}
  .layout{display:flex;height:100%;box-sizing:border-box}

  /* ---- Sidebar sinistra: rose delle squadre virtuali, in ordine alfabetico ---- */
  .sidebar{
    width:23vw;min-width:230px;height:100%;box-sizing:border-box;
    padding:3vh 1.2vw;overflow-y:auto;background:#0e1830;border-right:1px solid #1c2b45;
  }
  .sidebar h2{
    font-size:1.3vw;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin:0 0 2vh 0;
  }
  .roster-card{background:#1c2b45;border-radius:.7vw;padding:1.2vh 1vw;margin-bottom:1.4vh}
  .roster-card .team{font-size:1.6vw;font-weight:800;color:#4ade80;line-height:1.15}
  .roster-card .owner{font-size:1vw;opacity:.6;margin-top:.1vh}
  .roster-card .players{margin-top:.8vh}
  .roster-card .player-row{
    display:flex;justify-content:space-between;gap:.6vw;font-size:1.05vw;padding:.35vh 0;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .roster-card .player-row:first-child{border-top:none}
  .roster-card .player-name{opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .roster-card .player-price{color:#ffce45;font-weight:700;flex-shrink:0}
  .roster-empty{font-size:.95vw;opacity:.4;font-style:italic;margin-top:.4vh}
  .sidebar-empty{font-size:1.1vw;opacity:.5;margin-top:2vh}

  /* ---- Area centrale: tabellone principale ---- */
  .wrap{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;padding:4vh 3vw;box-sizing:border-box;min-width:0;
  }
  .player{font-size:5.5vw;font-weight:800;text-align:center}
  .team{font-size:2vw;opacity:.7;margin-top:.5vh}
  .price{font-size:11vw;font-weight:900;margin:2.5vh 0;color:#ffce45}
  .countdown{font-size:4.5vw;font-weight:900;color:#ffce45;margin-top:-1vh;margin-bottom:1vh;min-height:5vw}
  .bidder{font-size:3.2vw;font-weight:700;color:#4ade80}
  .status{font-size:1.8vw;opacity:.6;margin-top:1vh;letter-spacing:.1em;text-transform:uppercase}
  .automode{font-size:1.4vw;font-weight:700;color:#4ade80;letter-spacing:.1em;text-transform:uppercase;margin-top:.5vh;display:none}
  .list{display:flex;gap:1.5vw;flex-wrap:wrap;justify-content:center;margin-top:3vh}
  .chip{background:#1c2b45;border-radius:1vw;padding:1vh 1.5vw;font-size:1.4vw}
  .chip b{color:#ffce45}
</style>
</head>
<body>
  <div class="layout">
    <div class="sidebar">
      <h2>Rose fantasquadre</h2>
      <div id="rosters"></div>
    </div>

    <div class="wrap">
      <div class="status" id="status">In attesa del telefono Host…</div>
      <div class="automode" id="automode">Modalità automatica</div>
      <div class="player" id="player">—</div>
      <div class="team" id="team"></div>
      <div class="price" id="price">0</div>
      <div class="countdown" id="countdown"></div>
      <div class="bidder" id="bidder"></div>
      <div class="list" id="list"></div>
    </div>
  </div>

<!-- =========================================================================================
     CAST RECEIVER SDK (versione "custom", NON media): questa pagina non riproduce audio/video,
     mostra solo dati testuali dell'asta, quindi usiamo l'API base cast.receiver invece del
     framework CAF pensato per i player video.

     Flusso:
       1) Il Sender (app FantaBuzzer Android) avvia una sessione Cast verso questo receiver.
       2) Il Sender invia SUBITO un messaggio custom con { hostIp, port, roomId } — questa
          pagina, una volta caricata da Internet (GitHub Pages), è comunque fisicamente
          eseguita sul Chromecast, che è sulla STESSA rete locale del server embedded: può
          quindi aprire una connessione WebSocket diretta a ws://hostIp:port/ws, in locale,
          senza passare da Internet una seconda volta.
       3) Da lì in poi riceve i room_state_change broadcast come spettatore (join_as_spectator,
          vedi BuzzerServer.kt) e aggiorna la UI, incluse le rose delle fantasquadre
          (snapshot.rosters, vedi RoomManager.buildRostersLocked, già ordinate alfabeticamente
          per nome squadra) e il countdown (snapshot.roundDeadlineEpochMs / serverTimeEpochMs).
     ========================================================================================= -->
<script src="https://www.gstatic.com/cast/sdk/libs/receiver/2.0.0/cast_receiver.js"></script>
<script>
  const NAMESPACE = 'urn:x-cast:com.fantabuzzer.app';
  const els = {
    status: document.getElementById('status'),
    automode: document.getElementById('automode'),
    player: document.getElementById('player'),
    team: document.getElementById('team'),
    price: document.getElementById('price'),
    countdown: document.getElementById('countdown'),
    bidder: document.getElementById('bidder'),
    list: document.getElementById('list'),
    rosters: document.getElementById('rosters'),
  };

  let socket = null;

  // ---- Countdown: interpolato lato client tra i due valori che il server manda in OGNI
  // snapshot (roundDeadlineEpochMs / serverTimeEpochMs), cosi' scorre fluido anche tra un
  // aggiornamento websocket e l'altro, compensando lo sfasamento tra l'orologio del telefono
  // Host e quello del Chromecast. ----
  let deadlineMs = null;
  let clockOffsetMs = 0;
  function updateCountdown() {
    if (deadlineMs === null) { els.countdown.textContent = ''; return; }
    const estimatedServerNow = Date.now() + clockOffsetMs;
    const msLeft = deadlineMs - estimatedServerNow;
    const secLeft = msLeft > 0 ? Math.ceil(msLeft / 1000) : 0;
    els.countdown.textContent = '⏱ ' + secLeft;
    els.countdown.style.color = secLeft <= 3 ? '#e7352c' : '#ffce45';
  }
  setInterval(updateCountdown, 150);

  function renderRosters(rosters) {
    if (!rosters || rosters.length === 0) {
      els.rosters.innerHTML = '<div class="sidebar-empty">Nessuna squadra ancora.</div>';
      return;
    }
    // Il server le manda gia' ordinate per nome squadra, ma ordiniamo anche qui per
    // sicurezza (es. se un client vecchio inviasse l'elenco non ordinato).
    const sorted = rosters.slice().sort((a, b) => a.teamName.localeCompare(b.teamName));
    els.rosters.innerHTML = sorted.map(r => {
      const playersHtml = (r.players && r.players.length > 0)
        ? r.players.map(p =>
            '<div class="player-row">' +
              '<span class="player-name">' + p.playerName + '</span>' +
              '<span class="player-price">' + p.price + ' cr.</span>' +
            '</div>'
          ).join('')
        : '<div class="roster-empty">Nessun acquisto ancora.</div>';
      return '<div class="roster-card">' +
        '<div class="team">' + r.teamName + '</div>' +
        '<div class="owner">' + r.nickname + '</div>' +
        '<div class="players">' + playersHtml + '</div>' +
      '</div>';
    }).join('');
  }

  function connectToLocalServer(hostIp, port, roomId) {
    els.status.textContent = 'Connessione a ' + hostIp + ':' + port + '…';
    if (socket) { try { socket.close(); } catch (e) {} }

    socket = new WebSocket('ws://' + hostIp + ':' + port + '/ws');
    socket.onopen = () => {
      els.status.textContent = 'Connesso';
      socket.send(JSON.stringify({ type: 'join_as_spectator', roomId: roomId }));
    };
    socket.onclose = () => {
      els.status.textContent = 'Connessione persa, riprovo…';
      setTimeout(() => connectToLocalServer(hostIp, port, roomId), 2000);
    };
    socket.onerror = () => { els.status.textContent = 'Errore di connessione al server locale'; };
    socket.onmessage = (msg) => {
      const evt = JSON.parse(msg.data);
      if (evt.type !== 'room_state_change') return;
      const s = evt.snapshot;
      els.status.textContent = s.state;
      els.automode.style.display = s.autoMode ? 'block' : 'none';
      els.player.textContent = s.currentPlayer ? s.currentPlayer.name : 'In attesa del prossimo giocatore…';
      els.team.textContent = s.currentPlayer ? (s.currentPlayer.role + ' · ' + s.currentPlayer.team) : '';
      els.price.textContent = s.currentBid;
      const bidderP = s.participants.find(p => p.id === s.currentTopBidderId);
      els.bidder.textContent = bidderP ? ('In testa: ' + bidderP.nickname) : '';
      els.list.innerHTML = s.participants.map(p =>
        '<div class="chip">' + p.nickname + ': <b>' + p.creditsRemaining + '</b> cr.</div>'
      ).join('');
      renderRosters(s.rosters);
      if (s.roundDeadlineEpochMs && s.state === 'BUZZER_ACTIVE') {
        deadlineMs = s.roundDeadlineEpochMs;
        clockOffsetMs = s.serverTimeEpochMs - Date.now();
      } else {
        deadlineMs = null;
      }
      updateCountdown();
    };
  }

  const context = cast.receiver.CastReceiverManager.getInstance();
  const messageBus = context.getCastMessageBus(NAMESPACE);

  messageBus.onMessage = (event) => {
    // event.data è la stringa JSON inviata dal Sender: { hostIp, port, roomId }
    try {
      const config = JSON.parse(event.data);
      if (config.hostIp && config.port && config.roomId) {
        connectToLocalServer(config.hostIp, config.port, config.roomId);
      }
    } catch (e) {
      els.status.textContent = 'Messaggio dal telefono non valido';
    }
  };

  context.onSenderDisconnected = () => {
    // Ultimo sender disconnesso: per l'MVP lasciamo il receiver acceso a mostrare
    // l'ultimo stato noto invece di chiudere subito la sessione Cast.
  };

  context.start();
</script>
</body>
</html>
