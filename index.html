<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FantaBuzzer — Receiver</title>
<style>
  html,body{margin:0;height:100%;background:#0b1220;color:#f5f7fa;font-family:'Segoe UI',Roboto,sans-serif;overflow:hidden}
  .layout{display:flex;height:100%;box-sizing:border-box}

  /* ---- Sidebar sinistra: rose delle squadre virtuali, in ordine alfabetico ---- */
  .sidebar{
    width:22vw;min-width:210px;height:100%;box-sizing:border-box;
    padding:3vh 1.1vw;overflow-y:auto;background:#0e1830;border-right:1px solid #1c2b45;
  }
  .sidebar h2, .summary h2{
    font-size:1.2vw;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin:0 0 2vh 0;
  }
  .roster-card{background:#1c2b45;border-radius:.7vw;padding:1.2vh 1vw;margin-bottom:1.4vh}
  .roster-card .team{font-size:1.5vw;font-weight:800;color:#4ade80;line-height:1.15}
  .roster-card .owner{font-size:.95vw;opacity:.6;margin-top:.1vh}
  .roster-card .players{margin-top:.8vh}
  .roster-card .player-row{
    display:flex;justify-content:space-between;gap:.6vw;font-size:1vw;padding:.35vh 0;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .roster-card .player-row:first-child{border-top:none}
  .roster-card .player-name{opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .roster-card .player-price{color:#ffce45;font-weight:700;flex-shrink:0}
  .roster-empty{font-size:.9vw;opacity:.4;font-style:italic;margin-top:.4vh}
  .sidebar-empty{font-size:1vw;opacity:.5;margin-top:2vh}

  /* ---- Area centrale: tabellone principale ---- */
  .wrap{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;padding:4vh 2vw;box-sizing:border-box;min-width:0;
  }
  .player{font-size:5vw;font-weight:800;text-align:center}
  .team{font-size:1.9vw;opacity:.75;margin-top:.6vh;text-align:center}
  .team .rolebadge{
    display:inline-block;background:#233355;color:#8ecbff;border-radius:.5vw;
    padding:.2vh .8vw;font-size:.85vw;font-weight:700;text-transform:uppercase;
    letter-spacing:.06em;margin-right:.6vw;vertical-align:middle;
  }
  .price{font-size:10vw;font-weight:900;margin:2.5vh 0;color:#ffce45}
  .countdown-ring{position:relative;width:11vw;height:11vw;min-width:90px;min-height:90px;margin:.5vh 0 1.4vh;display:none}
  .countdown-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .countdown-ring .ring-track{fill:none;stroke:rgba(255,255,255,.12);stroke-width:9}
  .countdown-ring .ring-progress{fill:none;stroke:#ffce45;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .18s linear,stroke .2s}
  .countdown-ring .countdown-number{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.4vw;font-weight:900;color:#ffce45}
  .bidder{font-size:3vw;font-weight:700;color:#4ade80}
  .status{font-size:1.7vw;opacity:.6;margin-top:1vh;letter-spacing:.1em;text-transform:uppercase}
  .automode{font-size:1.3vw;font-weight:700;color:#4ade80;letter-spacing:.1em;text-transform:uppercase;margin-top:.5vh;display:none}
  .pausebadge{font-size:1.4vw;font-weight:900;color:#ffce45;letter-spacing:.1em;text-transform:uppercase;margin-top:.5vh;display:none}
  .list{display:flex;gap:1.3vw;flex-wrap:wrap;justify-content:center;margin-top:3vh}
  .chip{background:#1c2b45;border-radius:1vw;padding:1vh 1.4vw;font-size:1.3vw}
  .chip b{color:#ffce45}

  /* ---- Pannello destro: quanti calciatori mancano ancora, per ruolo ---- */
  .summary{
    width:15vw;min-width:170px;height:100%;box-sizing:border-box;
    padding:3vh 1.1vw;overflow-y:auto;background:#0e1830;border-left:1px solid #1c2b45;
    display:flex;flex-direction:column;
  }
  .summary .intro{font-size:.85vw;opacity:.5;margin-bottom:1.6vh;line-height:1.4}
  .role-count-row{
    background:#1c2b45;border-radius:.7vw;padding:1.1vh 1vw;margin-bottom:1vh;
    display:flex;align-items:baseline;justify-content:space-between;
  }
  .role-count-row .role-label{font-size:1.05vw;font-weight:700;opacity:.9}
  .role-count-row .role-remaining{font-size:1.9vw;font-weight:900;color:#ffce45}
  .role-count-row.zero .role-remaining{color:#4ade80}

  .join-qr{margin-top:auto;padding-top:2vh;text-align:center}
  .join-qr #joinQr{display:inline-block;line-height:0;background:#fff;padding:.35vw;border-radius:.35vw;width:5.2vw;max-width:80px;min-width:56px}
  .join-qr #joinQr img, .join-qr #joinQr canvas{width:100%!important;height:auto!important;display:block}
  .join-qr .join-qr-caption{font-size:.7vw;opacity:.6;margin-top:.6vh;line-height:1.3}
  .join-qr .join-qr-room{font-size:.85vw;font-weight:800;color:#ffce45}
</style>
</head>
<body>
  <div class="layout">
    <div class="sidebar">
      <h2>Rose fantasquadre</h2>
      <div id="rosters"></div>
    </div>

    <div class="wrap">
      <div class="status" id="status">In attesa del telefono Host…</div>
      <div class="pausebadge" id="pausebadge">⏸ In pausa</div>
      <div class="automode" id="automode">Modalità automatica</div>
      <div class="player" id="player">—</div>
      <div class="team" id="team"></div>
      <div class="price" id="price">0</div>
      <div class="countdown-ring" id="countdownRing">
        <svg viewBox="0 0 120 120">
          <circle class="ring-track" cx="60" cy="60" r="54"></circle>
          <circle class="ring-progress" id="ringProgress" cx="60" cy="60" r="54"></circle>
        </svg>
        <div class="countdown-number" id="countdown"></div>
      </div>
      <div class="bidder" id="bidder"></div>
      <div class="list" id="list"></div>
    </div>

    <div class="summary">
      <h2>Mancano all'asta</h2>
      <div class="intro">Calciatori ancora da presentare, per ruolo.</div>
      <div id="remaining"></div>
      <div class="join-qr" id="joinQrBox" style="display:none">
        <div id="joinQr"></div>
        <div class="join-qr-caption">Inquadra per entrare<br/><span class="join-qr-room" id="joinQrRoom"></span></div>
      </div>
    </div>
  </div>

<!-- =========================================================================================
     CAST RECEIVER SDK (versione "custom", NON media): questa pagina non riproduce audio/video,
     mostra solo dati testuali dell'asta, quindi usiamo l'API base cast.receiver invece del
     framework CAF pensato per i player video.

     Flusso:
       1) Il Sender (app FantaBuzzer Android) avvia una sessione Cast verso questo receiver.
       2) Il Sender invia SUBITO un messaggio custom con { hostIp, port, roomId } — questa
          pagina, una volta caricata da Internet (GitHub Pages), è comunque fisicamente
          eseguita sul Chromecast, che è sulla STESSA rete locale del server embedded: può
          quindi aprire una connessione WebSocket diretta a ws://hostIp:port/ws, in locale,
          senza passare da Internet una seconda volta.
       3) Da lì in poi riceve i room_state_change broadcast come spettatore (join_as_spectator,
          vedi BuzzerServer.kt) e aggiorna la UI: le rose delle fantasquadre a sinistra
          (snapshot.rosters, gia' ordinate alfabeticamente per nome squadra), il ruolo esteso
          (RUOLONOME) del calciatore in asta al centro, il countdown, e a destra quanti
          calciatori mancano ancora da presentare per ruolo (snapshot.remainingByRole, vedi
          RoomManager.buildRemainingByRoleLocked).
     ========================================================================================= -->
<script src="https://www.gstatic.com/cast/sdk/libs/receiver/2.0.0/cast_receiver.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const NAMESPACE = 'urn:x-cast:com.fantabuzzer.app';
  const els = {
    status: document.getElementById('status'),
    automode: document.getElementById('automode'),
    pausebadge: document.getElementById('pausebadge'),
    player: document.getElementById('player'),
    team: document.getElementById('team'),
    price: document.getElementById('price'),
    countdown: document.getElementById('countdown'),
    countdownRing: document.getElementById('countdownRing'),
    ringProgress: document.getElementById('ringProgress'),
    bidder: document.getElementById('bidder'),
    list: document.getElementById('list'),
    rosters: document.getElementById('rosters'),
    remaining: document.getElementById('remaining'),
  };

  // RUOLONOME esteso, sia per il calciatore in asta al centro sia per il riepilogo a destra.
  const roleLabels = { P: 'Portiere', D: 'Difensore', C: 'Centrocampista', A: 'Attaccante' };
  const roleLabelsPlural = { P: 'Portieri', D: 'Difensori', C: 'Centrocampisti', A: 'Attaccanti' };
  const roleOrder = ['P', 'D', 'C', 'A'];

  let socket = null;

  // ---- Countdown: interpolato lato client tra i due valori che il server manda in OGNI
  // snapshot (roundDeadlineEpochMs / serverTimeEpochMs), cosi' scorre fluido anche tra un
  // aggiornamento websocket e l'altro, compensando lo sfasamento tra l'orologio del telefono
  // Host e quello del Chromecast. ----
  let deadlineMs = null;
  let clockOffsetMs = 0;
  let totalRoundMs = 15000;
  const RING_RADIUS = 54;
  const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;
  els.ringProgress.style.strokeDasharray = String(RING_CIRCUMFERENCE);

  function updateCountdown() {
    if (deadlineMs === null) {
      els.countdownRing.style.display = 'none';
      return;
    }
    els.countdownRing.style.display = 'block';
    const estimatedServerNow = Date.now() + clockOffsetMs;
    const msLeft = deadlineMs - estimatedServerNow;
    const secLeft = msLeft > 0 ? Math.ceil(msLeft / 1000) : 0;
    const urgent = secLeft <= 3;
    els.countdown.textContent = String(secLeft);
    els.countdown.style.color = urgent ? '#e7352c' : '#ffce45';
    const fraction = totalRoundMs > 0 ? Math.max(0, Math.min(1, msLeft / totalRoundMs)) : 0;
    els.ringProgress.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - fraction));
    els.ringProgress.style.stroke = urgent ? '#e7352c' : '#ffce45';
  }
  setInterval(updateCountdown, 150);

  function renderRosters(rosters) {
    if (!rosters || rosters.length === 0) {
      els.rosters.innerHTML = '<div class="sidebar-empty">Nessuna squadra ancora.</div>';
      return;
    }
    // Il server le manda gia' ordinate per nome squadra, ma ordiniamo anche qui per
    // sicurezza (es. se un client vecchio inviasse l'elenco non ordinato).
    const sorted = rosters.slice().sort((a, b) => a.teamName.localeCompare(b.teamName));
    els.rosters.innerHTML = sorted.map(r => {
      const playersHtml = (r.players && r.players.length > 0)
        ? r.players.map(p =>
            '<div class="player-row">' +
              '<span class="player-name">' + p.playerName + '</span>' +
              '<span class="player-price">' + p.price + ' cr.</span>' +
            '</div>'
          ).join('')
        : '<div class="roster-empty">Nessun acquisto ancora.</div>';
      return '<div class="roster-card">' +
        '<div class="team">' + r.teamName + '</div>' +
        '<div class="owner">' + r.nickname + '</div>' +
        '<div class="players">' + playersHtml + '</div>' +
      '</div>';
    }).join('');
  }

  function renderRemaining(remainingByRole) {
    if (!remainingByRole || remainingByRole.length === 0) {
      els.remaining.innerHTML = '';
      return;
    }
    const byRole = {};
    remainingByRole.forEach(rc => { byRole[rc.role] = rc.remaining; });
    els.remaining.innerHTML = roleOrder.map(role => {
      const count = byRole[role] || 0;
      return '<div class="role-count-row' + (count === 0 ? ' zero' : '') + '">' +
        '<span class="role-label">' + roleLabelsPlural[role] + '</span>' +
        '<span class="role-remaining">' + count + '</span>' +
      '</div>';
    }).join('');
  }

  function renderJoinQr(hostIp, port, roomId) {
    // QR coi dati di connessione (IP:porta + codice stanza) da inquadrare col telefono invece
    // di digitarli a mano — vedi MainActivity.JoinSetupScreen (pulsante "Scansiona QR").
    const box = document.getElementById('joinQr');
    box.innerHTML = '';
    new QRCode(box, {
      text: 'fantabuzzer://' + hostIp + ':' + port + '/' + roomId,
      width: 80,
      height: 80,
      colorDark: '#0b1220',
      colorLight: '#ffffff',
    });
    document.getElementById('joinQrRoom').textContent = 'Stanza ' + roomId;
    document.getElementById('joinQrBox').style.display = 'block';
  }

  function connectToLocalServer(hostIp, port, roomId) {
    els.status.textContent = 'Connessione a ' + hostIp + ':' + port + '…';
    renderJoinQr(hostIp, port, roomId);
    if (socket) { try { socket.close(); } catch (e) {} }

    socket = new WebSocket('ws://' + hostIp + ':' + port + '/ws');
    socket.onopen = () => {
      els.status.textContent = 'Connesso';
      socket.send(JSON.stringify({ type: 'join_as_spectator', roomId: roomId }));
    };
    socket.onclose = () => {
      els.status.textContent = 'Connessione persa, riprovo…';
      setTimeout(() => connectToLocalServer(hostIp, port, roomId), 2000);
    };
    socket.onerror = () => { els.status.textContent = 'Errore di connessione al server locale'; };
    socket.onmessage = (msg) => {
      const evt = JSON.parse(msg.data);
      if (evt.type !== 'room_state_change') return;
      const s = evt.snapshot;
      els.status.textContent = s.state;
      els.automode.style.display = s.autoMode ? 'block' : 'none';
      els.pausebadge.style.display = s.isPaused ? 'block' : 'none';
      els.player.textContent = s.currentPlayer ? s.currentPlayer.name : 'In attesa del prossimo giocatore…';
      els.team.innerHTML = s.currentPlayer
        ? ('<span class="rolebadge">' + (roleLabels[s.currentPlayer.role] || s.currentPlayer.role) + '</span>' + s.currentPlayer.team)
        : '';
      els.price.textContent = s.currentBid;
      const bidderP = s.participants.find(p => p.id === s.currentTopBidderId);
      els.bidder.textContent = bidderP ? ('In testa: ' + bidderP.nickname) : '';
      els.list.innerHTML = s.participants.map(p =>
        '<div class="chip">' + p.nickname + ': <b>' + p.creditsRemaining + '</b> cr.</div>'
      ).join('');
      renderRosters(s.rosters);
      renderRemaining(s.remainingByRole);
      if (s.roundDeadlineEpochMs && s.state === 'BUZZER_ACTIVE') {
        deadlineMs = s.roundDeadlineEpochMs;
        clockOffsetMs = s.serverTimeEpochMs - Date.now();
        totalRoundMs = (s.roundTimeoutSeconds || 15) * 1000;
      } else {
        deadlineMs = null;
      }
      updateCountdown();
    };
  }

  const context = cast.receiver.CastReceiverManager.getInstance();
  const messageBus = context.getCastMessageBus(NAMESPACE);

  messageBus.onMessage = (event) => {
    // event.data è la stringa JSON inviata dal Sender: { hostIp, port, roomId }
    try {
      const config = JSON.parse(event.data);
      if (config.hostIp && config.port && config.roomId) {
        connectToLocalServer(config.hostIp, config.port, config.roomId);
      }
    } catch (e) {
      els.status.textContent = 'Messaggio dal telefono non valido';
    }
  };

  context.onSenderDisconnected = () => {
    // Ultimo sender disconnesso: per l'MVP lasciamo il receiver acceso a mostrare
    // l'ultimo stato noto invece di chiudere subito la sessione Cast.
  };

  context.start();
</script>
</body>
</html>
